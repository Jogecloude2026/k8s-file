apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

commonAnnotations:
  argocd.argoproj.io/sync-wave: "2"

resources:
- opensearch.yaml
- opensearch-dashboards.yaml
- ingress-logs.yaml # https://logs.jogecloud.online (basic auth)

# Secret "basic-auth" (for logs.jogecloud.online) is NOT stored in Git -
# create it with create-secrets.sh.

# Image tags - updated automatically by the ecommerce-final-project pipeline
images:
- name: 850919910503.dkr.ecr.eu-north-1.amazonaws.com/ecomerce/opensearch
  newTag: "10"
